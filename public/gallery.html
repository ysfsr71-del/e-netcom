<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>e-NetCoM · Uluslararası Etkinlik</title>
<style>
:root{--g:#087c61;--dark:#063f32;--bg:#f2f8f5;--line:#d5e7df}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#073228}.wrap{max-width:1180px;margin:0 auto;padding:32px 20px}.ey{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--g)}h1{font-size:42px;margin:8px 0 24px}.viewer{background:var(--dark);border-radius:24px;padding:18px;box-shadow:0 16px 40px rgba(7,50,40,.14)}.stage{position:relative;background:#fff;border-radius:18px;min-height:60vh;display:flex;align-items:center;justify-content:center;overflow:hidden}.slide{display:none;width:100%;height:68vh;max-height:760px;object-fit:contain;background:#fff}.slide.active{display:block}.nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border:0;border-radius:50%;background:rgba(255,255,255,.94);font-size:34px;color:var(--dark);cursor:pointer;box-shadow:0 5px 18px rgba(0,0,0,.15);z-index:2}.nav:hover{transform:translateY(-50%) scale(1.05)}.prev{left:16px}.next{right:16px}.counter{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(6,63,50,.88);color:#fff;padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px}.thumbs{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 2px}.thumb{border:2px solid transparent;background:#fff;padding:3px;border-radius:12px;cursor:pointer;flex:0 0 100px}.thumb.active{border-color:#bdf47c}.thumb img{display:block;width:100%;height:72px;object-fit:cover;border-radius:8px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{display:inline-block;text-decoration:none;font-weight:800;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--dark)}.primary{background:#bdf47c;color:var(--dark);border-color:#bdf47c}.notice{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:18px;line-height:1.6}.loading{padding:40px;text-align:center;color:#cfe8df;font-weight:700}.poster{background:#fff;border-radius:20px;padding:18px}.poster img{display:block;width:100%;max-height:78vh;object-fit:contain;border-radius:12px}.hidden{display:none}@media(max-width:700px){h1{font-size:32px}.slide{height:52vh}.stage{min-height:52vh}.nav{width:44px;height:44px;font-size:28px}}
</style></head><body><main class="wrap"><div class="ey" id="eyebrow">E-NETCOM · ULUSLARARASI ETKİNLİK</div><h1 id="title">Eğitim Programı</h1><section id="content" class="viewer"><div class="loading" id="loading">Görseller yükleniyor…</div></section><div id="actions" class="actions hidden"></div></main>
<script>
const params=new URLSearchParams(location.search),city=params.get('city')||'',view=params.get('view')||'photos';
const lang=localStorage.getItem('enetcom_lang')||'tr';
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const cityKey=city.toLocaleLowerCase('tr-TR');
const configs={
  'viyana':{
    title:{tr:'Viyana · University of Vienna',en:'Vienna · University of Vienna',de:'Wien · Universität Wien'},
    photos:['IMG_2621.jpg','IMG_2624.jpg','IMG_2628.jpg','IMG_2634.jpg','IMG_2637.jpg','IMG_2641.jpg','IMG_2645.jpg'].map(n=>'/assets/international/vienna/'+n),
    posters:['poster-01.png','poster-02.png'].map(n=>'/assets/international/vienna/'+n)
  }
};
const cfg=configs[cityKey];
const content=document.getElementById('content'),title=document.getElementById('title'),actions=document.getElementById('actions');
const L={
 tr:{ey:'E-NETCOM · ULUSLARARASI ETKİNLİK',photo:'📸 Sahadan Kareler',poster:'📋 Program Afişleri',back:'← Uluslararası buluşmalara dön',photos:'Sahadan kareler',posters:'Program afişleri',loading:'Görseller yükleniyor…',noPhoto:'Bu etkinlik için henüz fotoğraf yüklenmemiş.',noPoster:'Bu etkinlik için henüz program afişi yüklenmemiş.'},
 en:{ey:'E-NETCOM · INTERNATIONAL EVENT',photo:'📸 Field Photos',poster:'📋 Programme Posters',back:'← Back to international gatherings',photos:'Field photos',posters:'Programme posters',loading:'Loading visuals…',noPhoto:'No event photos have been uploaded yet.',noPoster:'No programme poster has been uploaded yet.'},
 de:{ey:'E-NETCOM · INTERNATIONALE VERANSTALTUNG',photo:'📸 Fotos vor Ort',poster:'📋 Programmplakate',back:'← Zurück zu internationalen Begegnungen',photos:'Fotos vor Ort',posters:'Programmplakate',loading:'Bilder werden geladen…',noPhoto:'Für diese Veranstaltung wurden noch keine Fotos hochgeladen.',noPoster:'Für diese Veranstaltung wurde noch kein Programmplakat hochgeladen.'}
}[lang]||null;
function home(){return '/#uluslararasi'}
function showError(msg){content.className='viewer';content.innerHTML='<div class="notice">'+esc(msg)+'</div>';actions.classList.remove('hidden');actions.innerHTML='<a class="btn" href="'+home()+'">'+L.back+'</a>'}
function validImages(list,done){if(!list.length){done([]);return}const found=[];let finished=0;list.forEach(src=>{const im=new Image();im.onload=()=>{found.push(src);if(++finished===list.length)done(found)};im.onerror=()=>{if(++finished===list.length)done(found)};im.src=src+'?v='+Date.now()})}
function renderSlides(list,kind){
 if(!list.length){showError(kind==='poster'?L.noPoster:L.noPhoto);return}
 const labels=kind==='poster'?L.posters:L.photos;
 content.className='viewer';
 content.innerHTML='<div class="stage">'+list.map((p,i)=>'<img class="slide" data-i="'+i+'" src="'+p+'" alt="'+esc(city)+' · '+esc(labels)+' '+(i+1)+'">').join('')+'<button class="nav prev" aria-label="Previous">‹</button><button class="nav next" aria-label="Next">›</button><div class="counter" id="counter"></div></div><div class="thumbs">'+list.map((p,i)=>'<button class="thumb" data-i="'+i+'"><img src="'+p+'" alt="'+esc(city)+' · '+(i+1)+'"></button>').join('')+'</div>';
 const slides=[...content.querySelectorAll('.slide')],thumbs=[...content.querySelectorAll('.thumb')],counter=document.getElementById('counter');let i=0;
 function show(k){i=(k+slides.length)%slides.length;slides.forEach((x,j)=>x.classList.toggle('active',j===i));thumbs.forEach((x,j)=>x.classList.toggle('active',j===i));counter.textContent=(i+1)+' / '+slides.length}
 content.querySelector('.prev').onclick=()=>show(i-1);content.querySelector('.next').onclick=()=>show(i+1);thumbs.forEach((x,j)=>x.onclick=()=>show(j));
 document.onkeydown=e=>{if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1)};show(0);
 actions.classList.remove('hidden');actions.innerHTML=kind==='poster'
   ? '<a class="btn primary" href="/gallery.html?city='+encodeURIComponent(city)+'">'+L.photo+'</a><a class="btn" href="'+home()+'">'+L.back+'</a>'
   : '<a class="btn" href="/gallery.html?city='+encodeURIComponent(city)+'&view=poster">'+L.poster+'</a><a class="btn" href="'+home()+'">'+L.back+'</a>';
}
if(!city){showError(lang==='en'?'Event information not found.':lang==='de'?'Veranstaltungsinformationen nicht gefunden.':'Etkinlik bilgisi bulunamadı.');}
else if(!cfg){
 // Preserve the existing generic province gallery for other cities.
 const slug=city.toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
 const rawBase='https://raw.githubusercontent.com/ysfsr71-del/e-netcom/main/public/'+slug+'/';
 const imgUrl=n=>rawBase+String(n).padStart(2,'0')+'.jpg';
 function discover(done){const found=[];let finished=0,total=60;for(let n=1;n<=total;n++){const im=new Image();im.onload=()=>{found.push({n,src:imgUrl(n)});if(++finished===total)done(found.sort((a,b)=>a.n-b.n))};im.onerror=()=>{if(++finished===total)done(found.sort((a,b)=>a.n-b.n))};im.src=imgUrl(n)+'?v='+Date.now()}}
 function genericPoster(){const src=rawBase+'afis.jpg?v='+Date.now(),im=new Image();im.onload=()=>{content.className='poster';content.innerHTML='<img src="'+src+'" alt="'+esc(city)+' '+esc(L.posters)+'">';actions.classList.remove('hidden');actions.innerHTML='<a class="btn primary" href="/gallery.html?city='+encodeURIComponent(city)+'">'+L.photo+'</a><a class="btn" href="'+home()+'">'+L.back+'</a>'};im.onerror=()=>showError(L.noPoster);im.src=src}
 if(view==='poster')genericPoster();else discover(list=>renderSlides(list.map(x=>x.src),'photos'));
}else{
 title.textContent=cfg.title[lang]||cfg.title.tr;document.getElementById('eyebrow').textContent=L.ey;
 if(view==='poster')validImages(cfg.posters,list=>renderSlides(list,'poster'));else validImages(cfg.photos,list=>renderSlides(list,'photos'));
}
</script></body></html>
