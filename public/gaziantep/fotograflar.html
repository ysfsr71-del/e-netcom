<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>e-NetCoM · Gaziantep · Sahadan Kareler</title><style>
:root{--g:#087c61;--dark:#063f32;--bg:#f2f8f5}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#073228}.wrap{max-width:1180px;margin:0 auto;padding:32px 20px}.ey{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--g)}h1{font-size:42px;margin:8px 0 24px}.viewer{background:#063f32;border-radius:24px;padding:18px;box-shadow:0 16px 40px rgba(7,50,40,.14)}.stage{position:relative;background:#fff;border-radius:18px;min-height:60vh;display:flex;align-items:center;justify-content:center;overflow:hidden}.slide{display:none;width:100%;height:68vh;max-height:760px;object-fit:contain;background:#fff}.slide.active{display:block}.nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border:0;border-radius:50%;background:rgba(255,255,255,.94);font-size:34px;color:var(--dark);cursor:pointer;box-shadow:0 5px 18px rgba(0,0,0,.15);z-index:2}.nav:hover{transform:translateY(-50%) scale(1.05)}.prev{left:16px}.next{right:16px}.counter{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(6,63,50,.88);color:#fff;padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px}.thumbs{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 2px}.thumb{border:2px solid transparent;background:#fff;padding:3px;border-radius:12px;cursor:pointer;flex:0 0 100px}.thumb.active{border-color:#bdf47c}.thumb img{display:block;width:100%;height:72px;object-fit:cover;border-radius:8px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{display:inline-block;text-decoration:none;font-weight:800;padding:12px 18px;border-radius:12px;border:1px solid #cfe2da}.primary{background:#bdf47c;color:#063f32;border-color:#bdf47c}.ghost{background:#fff;color:#063f32}.poster{margin-top:24px;background:#fff;border-radius:20px;padding:18px}.poster img{display:block;width:100%;max-height:760px;object-fit:contain;background:#fff;border-radius:12px}@media(max-width:700px){h1{font-size:32px}.slide{height:52vh}.stage{min-height:52vh}.nav{width:44px;height:44px;font-size:28px}}</style></head><body><main class="wrap"><div class="ey">E-NETCOM · SAHADAN KARELER</div><h1>Gaziantep Eğitim Programı</h1><section class="viewer"><div class="stage"><img class="slide" src="01.jpg" alt="Gaziantep · Fotoğraf 1"><img class="slide" src="02.jpg" alt="Gaziantep · Fotoğraf 2"><img class="slide" src="03.jpg" alt="Gaziantep · Fotoğraf 3"><img class="slide" src="04.jpg" alt="Gaziantep · Fotoğraf 4"><img class="slide" src="05.jpg" alt="Gaziantep · Fotoğraf 5"><button class="nav prev" aria-label="Önceki fotoğraf">‹</button><button class="nav next" aria-label="Sonraki fotoğraf">›</button><div class="counter" id="counter">1 / 5</div></div><div class="thumbs"><button class="thumb" data-i="0"><img src="01.jpg" alt="Gaziantep · Fotoğraf 1"></button><button class="thumb" data-i="1"><img src="02.jpg" alt="Gaziantep · Fotoğraf 2"></button><button class="thumb" data-i="2"><img src="03.jpg" alt="Gaziantep · Fotoğraf 3"></button><button class="thumb" data-i="3"><img src="04.jpg" alt="Gaziantep · Fotoğraf 4"></button><button class="thumb" data-i="4"><img src="05.jpg" alt="Gaziantep · Fotoğraf 5"></button></div></section><div class="actions"><a class="btn ghost" href="afis.html">🖼️ Afişi gör</a><a class="btn ghost" href="/#iller">← Haritadaki ile dön</a></div></main><script>const slides=[...document.querySelectorAll('.slide')], thumbs=[...document.querySelectorAll('.thumb')], counter=document.getElementById('counter');let i=0;function show(k){i=(k+slides.length)%slides.length;slides.forEach((x,j)=>x.classList.toggle('active',j===i));thumbs.forEach((x,j)=>x.classList.toggle('active',j===i));counter.textContent=(i+1)+' / '+slides.length}document.querySelector('.prev').onclick=()=>show(i-1);document.querySelector('.next').onclick=()=>show(i+1);thumbs.forEach((x,j)=>x.onclick=()=>show(j));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1)});show(0);</script></body></html>
