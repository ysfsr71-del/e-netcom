<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>e-NetCoM · Gaziantep · Sahadan Kareler</title><style>
:root{--green:#075746;--lime:#c8fb7b;--bg:#f2f8f5;--line:#d7e7e0}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#073228}.wrap{max-width:1120px;margin:auto;padding:34px 20px 50px}.ey{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#087c61}h1{font-size:clamp(32px,5vw,54px);margin:8px 0 6px}.sub{color:#55736a;margin:0 0 24px}.viewer{background:#063f32;border-radius:26px;padding:16px;box-shadow:0 18px 45px rgba(7,50,40,.12)}.stage{position:relative;background:#fff;border-radius:18px;min-height:520px;display:flex;align-items:center;justify-content:center;overflow:hidden}.stage img{display:block;max-width:100%;max-height:72vh;width:auto;height:auto;object-fit:contain}.nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;border-radius:50%;font-size:32px;line-height:1;background:rgba(255,255,255,.92);color:#063f32;cursor:pointer;box-shadow:0 5px 18px rgba(0,0,0,.15)}.nav.prev{left:16px}.nav.next{right:16px}.nav:disabled{opacity:.25;cursor:default}.caption{color:#fff;text-align:center;font-weight:800;padding:13px 0 4px}.counter{text-align:center;color:#bfe9da;font-size:13px}.thumbs{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 2px}.thumb{flex:0 0 92px;height:68px;border:2px solid transparent;border-radius:10px;padding:0;background:#fff;cursor:pointer;overflow:hidden}.thumb.active{border-color:var(--lime)}.thumb img{width:100%;height:100%;object-fit:cover}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{display:inline-block;padding:12px 18px;border-radius:12px;text-decoration:none;font-weight:800;background:var(--lime);color:#073228}.btn.alt{background:#fff;border:1px solid var(--line)}.hint{margin-top:16px;color:#668077;font-size:13px}.back{display:inline-block;margin-top:22px;color:#087c61;font-weight:800;text-decoration:none}@media(max-width:650px){.stage{min-height:360px}.nav{width:42px;height:42px;font-size:27px}.thumb{flex-basis:76px;height:58px}}
</style></head><body><main class="wrap"><div class="ey">E-NETCOM · SAHADAN KARELER</div><h1>Gaziantep Eğitim Programı</h1><p class="sub">24 Nisan 2026 · Vehbi Dinçerler Fen Lisesi · 90 katılımcı</p><section class="viewer"><div class="stage"><button class="nav prev" id="prev" aria-label="Önceki fotoğraf">‹</button><img id="main" src="01.jpg" alt="Gaziantep · Fotoğraf 1"><button class="nav next" id="next" aria-label="Sonraki fotoğraf">›</button></div><div class="caption" id="caption">Gaziantep · Fotoğraf 1</div><div class="counter" id="counter">1 / 5</div><div class="thumbs" id="thumbs"></div></section><div class="actions"><a class="btn" href="afis.html">🖼️ Afişi gör</a><a class="btn alt" href="/">← Ana sayfaya dön</a></div><div class="hint">Fotoğraflar arasında ‹ › düğmeleriyle, küçük önizlemelerle veya klavyedeki ← → tuşlarıyla geçebilirsiniz.</div></main><script>
const photos=['01.jpg','02.jpg','03.jpg','04.jpg','05.jpg'];let i=0;const main=document.getElementById('main'),cap=document.getElementById('caption'),counter=document.getElementById('counter'),thumbs=document.getElementById('thumbs');
photos.forEach((p,n)=>{const b=document.createElement('button');b.className='thumb';b.innerHTML=`<img src="${p}" alt="Gaziantep Fotoğraf ${n+1}">`;b.onclick=()=>show(n);thumbs.appendChild(b)});
function show(n){i=(n+photos.length)%photos.length;main.src=photos[i];main.alt=`Gaziantep · Fotoğraf ${i+1}`;cap.textContent=`Gaziantep · Fotoğraf ${i+1}`;counter.textContent=`${i+1} / ${photos.length}`;[...thumbs.children].forEach((b,k)=>b.classList.toggle('active',k===i))}
document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1)});show(0);
</script></body></html>
