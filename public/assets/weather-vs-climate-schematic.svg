<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Weather variability and long-term climate trend</title><desc id="desc">Two illustrative diagrams compare daily weather fluctuations with a rising long-term climate trend. The lines are schematic, not observed measurements.</desc><rect width="1200" height="650" rx="32" fill="#f3f8f5"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#163d34">Weather is not the same as climate</text><text x="60" y="109" font-family="Arial,sans-serif" font-size="21" fill="#47675d">Illustrative patterns — not measured data</text><g font-family="Arial,sans-serif"><rect x="54" y="150" width="525" height="400" rx="22" fill="#fff"/><rect x="621" y="150" width="525" height="400" rx="22" fill="#fff"/><text x="85" y="204" font-size="27" font-weight="bold" fill="#173d34">Weather: day to day</text><text x="651" y="204" font-size="27" font-weight="bold" fill="#173d34">Climate: long-term pattern</text><g stroke="#d6e5dd" stroke-width="2"><path d="M100 250V478H535M667 250V478H1103"/><path d="M100 310H535M100 380H535M667 310H1103M667 380H1103"/></g><polyline fill="none" stroke="#257eb4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" points="105,368 135,325 165,415 195,285 225,370 255,342 285,433 315,314 345,375 375,265 405,396 435,320 465,359 495,288 530,345"/><path d="M675 428C750 415 810 392 865 364S1000 303 1096 274" fill="none" stroke="#16815f" stroke-width="9" stroke-linecap="round"/><path d="M675 435L710 395 744 439 779 362 815 406 849 344 884 378 920 305 954 345 988 286 1020 319 1056 258 1096 274" fill="none" stroke="#257eb4" stroke-width="4" stroke-linejoin="round" opacity=".75"/><text x="110" y="514" font-size="19" fill="#526c62">Short-term changes</text><text x="675" y="514" font-size="19" fill="#526c62">Trend across many years</text></g><text x="60" y="602" font-family="Arial,sans-serif" font-size="19" fill="#47675d">e-NetCoM Green Guide · Original educational illustration · CC0-style original work</text></svg>