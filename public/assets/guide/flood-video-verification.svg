<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Flood video verification: four checks before sharing</title>
<desc id="desc">An educational illustration of a phone video, source and date check, flood map legend, and official warning, connected by arrows. It is not a real flood or an operational warning.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c3432"/><stop offset="1" stop-color="#176c67"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<text x="65" y="92" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#fff">VERIFY BEFORE YOU SHARE</text>
<text x="66" y="134" font-family="Arial,sans-serif" font-size="22" fill="#c5eee2">Flood footage • context • risk maps • official warnings</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
