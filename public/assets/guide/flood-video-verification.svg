<g transform="translate(620 200)"><rect width="235" height="275" rx="22" fill="#fff"/><path d="M47 54l48-15 47 15 47-15v123l-47 15-47-15-48 15Z" fill="#e6f2eb" stroke="#36766d" stroke-width="4"/><path d="M95 40v122M142 55v122" stroke="#36766d" stroke-width="3"/><path d="M58 120 Q90 83 116 111 T181 92" fill="none" stroke="#54b5d1" stroke-width="12"/><text x="117" y="226" font-size="22" font-weight="700" fill="#143b35">3. MAP</text><text x="117" y="250" font-size="15" fill="#385b55">Read the legend</text></g>
