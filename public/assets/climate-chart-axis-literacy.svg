<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Climate chart scale literacy</title><desc id="desc">Two charts with the same data but different vertical axis ranges, demonstrating how scale affects visual impression.</desc><rect width="1200" height="675" fill="#eef6f2"/><rect x="65" y="75" width="1070" height="530" rx="30" fill="#fff"/><text x="100" y="130" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#16483c">READ THE AXIS · CHECK THE SCALE</text><text x="100" y="170" font-family="Arial,sans-serif" font-size="20" fill="#45655e">Same values, different vertical ranges</text><g stroke="#d3dfd9" stroke-width="2"><path d="M145 230V505H540M665 230V505H1060"/><path d="M145 365H540M665 365H1060" stroke-dasharray="8 9"/></g><g font-family="Arial,sans-serif" font-size="18" fill="#45655e"><text x="150" y="215">0–100</text><text x="675" y="215">48–54</text><text x="125" y="505">0</text><text x="645" y="505">48</text><text x="635" y="235">54</text></g><polyline points="175,367 245,360 315,352 385,347 455,340 525,335" fill="none" stroke="#2d8b71" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="695,455 765,410 835,365 905,335 975,290 1045,260" fill="none" stroke="#2d8b71" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><g fill="#2d8b71"><circle cx="175" cy="367" r="8"/><circle cx="525" cy="335" r="8"/><circle cx="695" cy="455" r="8"/><circle cx="1045" cy="260" r="8"/></g><text x="100" y="566" font-family="Arial,sans-serif" font-size="21" fill="#16483c">Always inspect units, baseline, period and source before sharing.</text></svg>