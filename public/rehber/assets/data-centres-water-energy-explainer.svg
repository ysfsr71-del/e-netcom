<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Data centre electricity and water accounting</title><desc id="desc">Original schematic showing power supply to a data centre, cooling water withdrawal and return flow, with separate accounting for water consumption.</desc><rect width="1200" height="675" fill="#edf5f1"/><rect x="55" y="55" width="1090" height="565" rx="28" fill="#fff"/><text x="95" y="120" font-family="Arial,sans-serif" font-size="35" font-weight="bold" fill="#184c41">DATA CENTRES: ENERGY &amp; WATER</text><text x="95" y="155" font-family="Arial,sans-serif" font-size="20" fill="#45685f">Illustrative flows — not measured quantities</text><rect x="110" y="245" width="220" height="170" rx="20" fill="#dcebe4" stroke="#337963" stroke-width="4"/><text x="220" y="300" text-anchor="middle" font-family="Arial" font-size="24" fill="#174c40">POWER</text><text x="220" y="332" text-anchor="middle" font-family="Arial" font-size="21" fill="#174c40">SUPPLY</text><rect x="475" y="220" width="250" height="215" rx="20" fill="#d6e7f1" stroke="#356b86" stroke-width="4"/><text x="600" y="280" text-anchor="middle" font-family="Arial" font-size="24" fill="#19465c">DATA CENTRE</text><g stroke="#356b86" stroke-width="5"><path d="M520 320h160M520 350h160M520 380h160"/></g><rect x="870" y="245" width="220" height="170" rx="20" fill="#dcebf4" stroke="#387ca0" stroke-width="4"/><text x="980" y="300" text-anchor="middle" font-family="Arial" font-size="24" fill="#19465c">COOLING</text><text x="980" y="332" text-anchor="middle" font-family="Arial" font-size="21" fill="#19465c">SYSTEM</text><path d="M330 330H470" stroke="#e2a34d" stroke-width="12"/><path d="M451 312l24 18-24 18" fill="none" stroke="#e2a34d" stroke-width="9"/><path d="M725 330H865" stroke="#387ca0" stroke-width="12"/><path d="M847 312l24 18-24 18" fill="none" stroke="#387ca0" stroke-width="9"/><path d="M920 415V505H760" stroke="#387ca0" stroke-width="8" fill="none"/><path d="M780 487l-24 18 24 18" fill="none" stroke="#387ca0" stroke-width="7"/><text x="855" y="545" font-family="Arial" font-size="18" fill="#19465c">Return flow</text><path d="M1040 415V490" stroke="#387ca0" stroke-width="8"/><path d="M1022 475l18 24 18-24" fill="none" stroke="#387ca0" stroke-width="7"/><text x="1000" y="530" text-anchor="middle" font-family="Arial" font-size="18" fill="#19465c">Consumed</text><text x="600" y="575" text-anchor="middle" font-family="Arial" font-size="18" fill="#45685f">Withdrawal ≠ consumption · On-site water ≠ electricity-related water</text></svg>