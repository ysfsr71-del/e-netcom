<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Heat alert verification and cool spaces</title><desc id="desc">Three illustrated steps: check an official heat warning, verify access to a cool place, and confirm source, location and validity date.</desc><rect width="1200" height="630" fill="#f4f8f5"/><rect x="45" y="48" width="1110" height="534" rx="30" fill="#fff" stroke="#d5e6dd" stroke-width="3"/><text x="90" y="112" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#164d40">Heat alerts: check before sharing</text><text x="90" y="150" font-family="Arial,sans-serif" font-size="22" fill="#41675b">A three-step media-literacy guide · e-NetCoM</text><g font-family="Arial,sans-serif"><rect x="90" y="210" width="290" height="275" rx="22" fill="#fff4e4" stroke="#e7b86e" stroke-width="3"/><circle cx="235" cy="277" r="40" fill="#f3ae47"/><g stroke="#bd7022" stroke-width="6" stroke-linecap="round"><path d="M235 220v-12M235 346v-12M178 277h-12M304 277h-12M194 236l-9-9M276 318l9 9M276 236l9-9M194 318l-9 9"/></g><text x="235" y="382" text-anchor="middle" font-size="26" font-weight="700" fill="#67451c">1. Official alert</text><text x="235" y="417" text-anchor="middle" font-size="19" fill="#67451c">Issuer · area · period</text><path d="M400 340h45m-12-12 12 12-12 12" fill="none" stroke="#3b7d69" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="460" y="210" width="290" height="275" rx="22" fill="#e9f5ed" stroke="#8cbfa4" stroke-width="3"/><path d="M553 313v-56l52-43 52 43v56M565 311h80v-50h-80z" fill="#a6d2b6" stroke="#286d50" stroke-width="6" stroke-linejoin="round"/><path d="M598 311v-31h18v31" fill="#fff" stroke="#286d50" stroke-width="4"/><text x="605" y="382" text-anchor="middle" font-size="26" font-weight="700" fill="#24583f">2. Cool place</text><text x="605" y="417" text-anchor="middle" font-size="19" fill="#24583f">Hours · access · travel</text><path d="M77