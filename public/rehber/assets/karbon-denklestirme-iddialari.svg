<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Carbon claims: reduce emissions first, then scrutinise credits</title><desc id="desc">Two separate pathways: a factory reduces its own emissions; a carbon credit claim is checked for additionality, double counting, permanence and public retirement records. Credits do not erase remaining emissions.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#103e3a"/><stop offset="1" stop-color="#102d45"/></linearGradient></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="64" y="86" fill="#fff" font-size="37" font-family="Arial,sans-serif" font-weight="bold">CARBON CLAIMS: TWO DIFFERENT ACTIONS</text><text x="64" y="128" fill="#c5e9df" font-size="22" font-family="Arial,sans-serif">A credit claim is not the same as reducing emissions at source</text><rect x="62" y="171" width="510" height="326" rx="24" fill="#e4f7e8"/><rect x="628" y="171" width="510" height="326" rx="24" fill="#e7f0fb"/><text x="96" y="222" fill="#145b37" font-size="28" font-family="Arial,sans-serif" font-weight="bold">1. REDUCE AT SOURCE</text><path d="M150 390V301l85 42v-42l85 42v-85h66v132z" fill="#287b55"/><path d="M188 282q-25-35 7-55m39 61q-25-35 7-55" fill="none" stroke="#7da79b" stroke-width="11" stroke-linecap="round"/><path d="M430 290v108m-28-25 28 25 28-25" fill="none" stroke="#148b59" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="461" fill="#174f3b" font-size="22" font-family="Arial,sans-serif">Measure and cut actual emissions</text><text x="660" y="222" fill="#244f82" font-size="28" font-family="Arial,sans-serif" font-weight="bold">2. CHECK CREDIT CLAIMS</text><rect x="682" y="257" width="410" height="181" rx="16" fill="#fff"/><g fill="#244f82" font-size="23" font-family="Arial,sans-serif"><text x="713" y="298">✓ Additional climate benefit?</text><text x="713" y="338">✓ No double counting?</text><text x="713" y="378">✓ Durable outcome?</text><text x="713" y="418">✓ Public retirement record?</text></g><text x="660" y="462" fill="#244f82" font-size="20" font-family="Arial,sans-serif">Check project-specific evidence</text><rect x="62" y="528" width="1076" height="95" rx="20" fill="#f8e9bd"/><text x="94" y="567" fill="#62430c" font-size="26" font-family="Arial,sans-serif" font-weight="bold">Important: Credits do not make remaining emissions disappear.</text><text x="94" y="599" fill="#62430c" font-size="19" font-family="Arial,sans-serif">Ask what was reduced, what remains, and what evidence supports the claim.</text></svg>