<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Deniz çayırları ve mavi karbon: kıyı ekosisteminin kesiti</title><desc id="desc">Suyun altında yeşil deniz çayırı yaprakları, aralarında balıklar; tabanda rizom ve kökler ile karbonun biriktiği tortu katmanları. Üstte kıyı çizgisi ve dalgalar. Ölçeksiz kavramsal eğitim görselidir.</desc><defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#77d4db"/><stop offset="1" stop-color="#0a6978"/></linearGradient><linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ddc18d"/><stop offset="1" stop-color="#90734f"/></linearGradient></defs><rect width="1200" height="675" fill="#0c4050"/><text x="48" y="66" font-family="system-ui,sans-serif" font-size="41" font-weight="800" fill="#fff">DENİZ ÇAYIRLARI &amp; MAVİ KARBON</text><text x="50" y="102" font-family="system-ui,sans-serif" font-size="22" fill="#d7f7ec">Akdeniz'in görünmeyen yaşam ve karbon deposu</text><rect x="45" y="134" width="1110" height="455" rx="25" fill="url(#sea)"/><path d="M45 180Q150 158 270 181T515 179T750 178T970 181T1155 178" fill="none" stroke="#d4f9f0" stroke-width="7" opacity=".8"/><path d="M45 469Q250 453 430 468T810 464T1155 463V589H45Z" fill="url(#sand)"/><path d="M45 529Q230 517 410 533T780 529T1155 527" stroke="#ad946e" stroke-width="5" fill="none"/><g stroke="#1d7d55" stroke-width="8" stroke-linecap="round" fill="none"><path d="M220 471Q200 376 225 272M245 470Q285 366 260 244M280 472Q310 345 332 285M385 472Q350 364 365 254M420 470Q465 357 448 276M485 470Q470 342 512 228M585 470Q540 366 564 292M624 470Q675 360 652 261M700 470Q665 346 698 249M755 470Q785 361 779 279M835 469Q811 358 848 247M885 469Q922 360 906 293M962 469Q930 358 959 267"/></g><g stroke="#2c9b63" stroke-width="5" stroke-linecap="round" fill="none"><path d="M190 482H975M225 482L205 519M265 482L282 521M365 482L349 518M480 482L505 519M585 482L572 522M702 482L724 522M835 482L820 521M954 482L973 520"/></g><g fill="#e3f7a2" stroke="#165e6a" stroke-width="4"><path d="M315 331q34-27 70 0-36 27-70 0l-20-15v30z"/><circle cx="368" cy="327" r="3" fill="#165e6a"/><path d="M715 356q43-28 83 0-40 29-83 0l-24-17v34z"/><circle cx="779" cy="351" r="3" fill="#165e6a"/><path d="M907 308q27-20 54 0-27 21-54 0l-17-13v26z"/></g><g font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#fff"><text x="73" y="228">Yaşam alanı</text><text x="760" y="226">Dalga enerjisini</text><text x="760" y="256">yavaşlatır</text></g><g font-family="system-ui,sans-serif" fill="#263e37" font-size="22" font-weight="700"><text x="65" y="568">Kökler ve rizomlar tortuyu tutar</text><text x="715" y="568">Karbon tortuda birikebilir</text></g><g fill="#eaf9ed" font-family="system-ui,sans-serif" font-size="20"><text x="50" y="631">e-NetCoM Yeşil Rehber • Özgün kavramsal çizim • Ölçekli ölçüm değildir</text></g></svg>