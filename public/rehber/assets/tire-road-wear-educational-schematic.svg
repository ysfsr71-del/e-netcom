<text x="775" y="367" font-size="22" font-family="Arial,sans-serif" fill="#20536b">Rainwater may carry</text>
<text x="775" y="395" font-size="22" font-family="Arial,sans-serif" fill="#20536b">deposited material</text>
<text x="600" y="612" text-anchor="middle" font-size="21" font-family="Arial,sans-serif" fill="#3e5c60">Tire wear, pavement wear, brake wear and road dust are distinct categories.</text>
<text x="600" y="643" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" fill="#3e5c60">Particle composition and environmental fate require actual sampling and analysis.</text>
