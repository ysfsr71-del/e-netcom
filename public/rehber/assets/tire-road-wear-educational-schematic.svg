<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Tire and road wear particles — educational schematic</title>
<desc id="d">Diagram of a road, tire contact, possible airborne particles and rainwater runoff to a drain. Conceptual pathways only; no measured concentrations or proportional quantities.</desc>
