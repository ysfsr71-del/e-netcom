<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Satellite land surface temperature and air temperature are different measurements</title><desc id="desc">Educational cross-section: a satellite measures thermal radiation from roofs, roads and vegetation; a shaded thermometer measures air temperature around two metres above ground. The illustration contains no real measurements.</desc><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d8f0fa"/><stop offset="1" stop-color="#f8fbec"/></linearGradient><linearGradient id="road"><stop stop-color="#ed9c56"/><stop offset="1" stop-color="#bb5b38"/></linearGradient></defs><rect width="1200" height="675" fill="url(#sky)"/><rect x="45" y="35" width="1110" height="605" rx="28" fill="#fff" opacity=".75"/><text x="82" y="95" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#173e37">Two temperatures, two different observations</text><text x="82" y="132" font-family="Arial,sans-serif" font-size="21" fill="#426a61">Illustrative diagram — not a real satellite image or temperature reading</text><g transform="translate(480 170)"><rect x="65" y="0" width="95" height="40" rx="9" fill="#274f7b"/><rect x="0" y="8" width="60" height="24" fill="#5b93c2"/><rect x="165" y="8" width="60" height="24" fill="#5b93c2"/><path d="M112 40 L112 70" stroke="#274f7b" stroke-width="7"/><path d="M112 70 L105 78 L119 78Z" fill="#274f7b"/></g><path d="M590 258 L355 480 M590 258 L838 480" stroke="#d87538" stroke-width="4" stroke-dasharray="13 12" opacity=".8"/><rect x="83" y="488" width="1034" height="100" rx="10" fill="#7caa75"/><path d="M83 545 H1117" stroke="#e2d2aa" stroke-width="30"/><rect x="215" y="360" width="215" height="128" fill="#d9a77c"/><path d="M200 360 L322 287 L447 360Z" fill="#c36d52"/><rect x="290" y="408" width="58" height="80" fill="#6b8d9b"/><rect x="700" y="395" width="210" height="93" fill="url(#road)"/><g fill="#397f54"><circle cx="975" cy="396" r="65"/><circle cx="1022" cy="421" r="52"/><circle cx="937" cy="427" r="49"/></g><path d="M977 448 V489" stroke="#725c3e" stroke-width="17"/><g transform="translate(530 356)"><rect x="0" y="0" width="110" height="132" rx="9" fill="#f5f6ed" stroke="#305c68" stroke-width="4"/><path d="M55 20 V91" stroke="#2469a3" stroke-width="13" stroke-linecap="round"/><circle cx="55" cy="102" r="20" fill="#2469a3"/><path d="M118 132 V0" stroke="#315e60" stroke-width="3" stroke-dasharray="8 7"/><text x="129" y="75" font-size="22" fill="#264f4e" font-family="Arial">~2 m</text></g><rect x="110" y="192" width="320" height="75" rx="13" fill="#fff" stroke="#d7e5e0"/><text x="130" y="221" font-family="Arial" font-size="21" font-weight="bold" fill="#a94d32">LAND SURFACE</text><text x="130" y="249" font-family="Arial" font-size="19" fill="#395d56">Thermal satellite estimate</text><rect x="754" y="192" width="340" height="75" rx="13" fill="#fff" stroke="#d7e5e0"/><text x="774" y="221" font-family="Arial" font-size="21" font-weight="bold" fill="#23638c">NEAR-SURFACE AIR</text><text x="774" y="249" font-family="Arial" font-size="19" fill="#395d56">Shielded weather observation</text><path d="M764 267 L610 355" stroke="#23638c" stroke-width="3" fill="none"/><rect x="100" y="600" width="1000" height="26" rx="10" fill="#e9f2ec"/><text x="115" y="619" font-family="Arial" font-size="17" fill="#345d50">Check legend, observation time, resolution and cloud screening before comparing maps.</text></svg>