<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Rainwater runoff and rain garden — schematic comparison</title><desc id="desc">Left: rain falling on an impervious road flows rapidly toward a drain. Right: a shallow planted rain garden receives runoff; some water infiltrates the soil while an overflow outlet remains available. Illustrative only, not measured data.</desc><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d9f1f5"/><stop offset="1" stop-color="#f3faf5"/></linearGradient><pattern id="soil" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#ad805e"/><circle cx="7" cy="8" r="2" fill="#77553c"/><circle cx="17" cy="17" r="2" fill="#d6a37d"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1778a3"/></marker></defs><rect width="1200" height="680" fill="#f7f9f4"/><rect x="32" y="32" width="552" height="580" rx="24" fill="url(#sky)" stroke="#b8d3cf" stroke-width="3"/><rect x="616" y="32" width="552" height="580" rx="24" fill="url(#sky)" stroke="#b8d3cf" stroke-width="3"/><g fill="#183d38" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle"><text x="308" y="91" font-size="32">IMPERVIOUS SURFACE</text><text x="892" y="91" font-size="32">RAIN GARDEN</text></g><g stroke="#398eb3" stroke-width="7" stroke-linecap="round"><path d="m130 145 -18 34m75-34 -18 34m75-34 -18 34m75-34 -18 34m75-34 -18 34m75-34 -18 34"/><path d="m715 145 -18 34m75-34 -18 34m75-34 -18 34m75-34 -18 34m75-34 -18 34m75-34 -18 34"/></g><path d="M32 355H584V612H32Z" fill="url(#soil)"/><path d="M32 340H584V371H32Z" fill="#666d70"/><path d="M616 365H755Q820 470 890 470Q960 470 1025 365H1168V612H616Z" fill="url(#soil)"/><path d="M616 353H754Q824 452 890 452Q956 452 1026 353H1168" fill="none" stroke="#548a52" stroke-width="24"/><path d="M86 310H505" fill="none" stroke="#1778a3" stroke-width="13" marker-end="url(#arrow)"/><rect x="496" y="339" width="55" height="24" rx="5" fill="#364b55"/><g stroke="#f1f5f5" stroke-width="5"><path d="M508 342v18m14-18v18m14-18v18"/></g><path d="M704 306Q765 317 798 374" fill="none" stroke="#1778a3" stroke-width="11" marker-end="url(#arrow)"/><path d="M863 460v104m58-104v104" fill="none" stroke="#1778a3" stroke-width="8" stroke-dasharray="13 15" marker-end="url(#arrow)"/><path d="M1018 423q45-30 87-30" fill="none" stroke="#1778a3" stroke-width="7" stroke-dasharray="14 12" marker-end="url(#arrow)"/><g stroke="#2c724d" stroke-width="8" stroke-linecap="round" fill="none"><path d="M814 407v-75m-45 53 45-31m0 0 35-28M958 410v-87m-42 59 42-33m0 0 37-35"/></g><g fill="#4eaa67"><ellipse cx="782" cy="348" rx="28" ry="13" transform="rotate(35 782 348)"/><ellipse cx="837" cy="344" rx="29" ry="14" transform="rotate(-35 837 344)"/><ellipse cx="930" cy="340" rx="30" ry="14" transform="rotate(35 930 340)"/><ellipse cx="985" cy="330" rx="29" ry="14" transform="rotate(-35 985 330)"/></g><g fill="#214c47" font-family="Arial, sans-serif" font-size="24" text-anchor="middle"><text x="308" y="425">Rapid surface runoff</text><text x="892" y="515">Infiltration where suitable</text><text x="1080" y="450" font-size="20">Overflow</text></g><rect x="190" y="626" width="820" height="38" rx="19" fill="#e2efe8"/><text x="600" y="652" fill="#315b50" font-size="19" font-family="Arial, sans-serif" text-anchor="middle">SCHEMATIC ONLY — NOT MEASURED DATA / e-NetCoM Green Guide</text></svg>