<text x="70" y="598" font-family="Arial,sans-serif" font-size="23" fill="#ecf8ee">Az tüketim  →  bakım ve tamir  →  yeniden kullanım  →  uygun toplama</text>
<text x="70" y="637" font-family="Arial,sans-serif" font-size="16" fill="#d0e5d7">e-NetCoM için hazırlanmış şematik görsel · Sayısal çevresel etki iddiası içermez.</text>
