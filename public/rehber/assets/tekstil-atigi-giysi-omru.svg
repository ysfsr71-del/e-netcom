<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Giysinin ömrünü uzatma döngüsü</title><desc id="d">Üç aşamalı özgün çizim: ihtiyacı sorgula, uzun süre kullan ve onar, uygun şekilde yeniden kullan veya ayrı topla. Kıyafetin ömrünü uzatmak, yalnızca geri dönüşümden önce gelir.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#103b36"/><stop offset="1" stop-color="#226c59"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".18"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/><circle cx="1100" cy="90" r="220" fill="#ffffff" opacity=".035"/><circle cx="60" cy="640" r="280" fill="#ffffff" opacity=".04"/>
<text x="70" y="95" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#c8f075">YEŞİL REHBER · TEKSTİL VE DÖNGÜSELLİK</text>
<text x="70" y="157" font-family="Arial,sans-serif" font-size="48" font-weight="800" fill="#fff">Bir giysinin daha uzun ömrü</text>
<text x="70" y="201" font-family="Arial,sans-serif" font-size="24" fill="#e3f1e8">En iyi seçenek her zaman yeni bir ürün almak değildir.</text>
<g font-family="Arial,sans-serif" filter="url(#s)">
<rect x="62" y="255" width="335" height="275" rx="24" fill="#fff"/><rect x="433" y="255" width="335" height="275" rx="24" fill="#fff"/><rect x="804" y="255" width="335" height="275" rx="24" fill="#fff"/>
</g>
