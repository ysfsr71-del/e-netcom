<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Wildlife image verification: evidence chain</title><desc id="desc">An original educational diagram with five connected stages: identify claim, trace source, inspect provenance, check ecological context, and share responsibly. No image-analysis stage alone establishes authenticity.</desc><rect width="1200" height="630" fill="#f5faf6"/><rect x="44" y="42" width="1112" height="546" rx="30" fill="#fff" stroke="#c7dfd0" stroke-width="2"/><text x="88" y="112" fill="#174b37" font-family="Arial,sans-serif" font-size="39" font-weight="700">WILDLIFE IMAGE VERIFICATION</text><text x="88" y="153" fill="#42685a" font-family="Arial,sans-serif" font-size="23">Follow the evidence, not just the pixels</text><path d="M150 302 H1050" stroke="#91b7a4" stroke-width="7" stroke-linecap="round"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#1e6c50"><circle cx="150" cy="302" r="43"/><circle cx="375" cy="302" r="43"/><circle cx="600" cy="302" r="43"/><circle cx="825" cy="302" r="43"/><circle cx="1050" cy="302" r="43"/></g><g fill="white" font-size="29" font-weight="700"><text x="150" y="313">1</text><text x="375" y="313">2</text><text x="600" y="313">3</text><text x="825" y="313">4</text><text x="1050" y="313">5</text></g><g fill="#174b37" font-size="22" font-weight="700"><text x="150" y="392">CLAIM</text><text x="375" y="392">SOURCE</text><text x="600" y="392">PROVENANCE</text><text x="825" y="392">ECOLOGY</text><text x="1050" y="392">SHARING</text></g><g fill="#47665a" font-size="17"><text x="150" y="423">What is asserted?</text><text x="375" y="423">Who posted first?</text><text x="600" y="423">What is recorded?</text><text x="825" y="423">Does context fit?</text><text x="1050" y="423">Label uncertainty</text></g></g><rect x="88" y="485" width="1024" height="64" rx="14" fill="#e5f2e9"/><text x="600" y="525" text-anchor="middle" fill="#24513e" font-family="Arial,sans-serif" font-size="20">Missing metadata is not proof of AI generation. A plausible habitat is not proof of a photograph.</text></svg>