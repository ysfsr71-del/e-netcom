<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Migratory birds and artificial lighting — schematic comparison</title>
<desc id="desc">Left: unshielded outdoor lighting sends light upward near a bird flight path. Right: shielded downward-facing lighting reduces unnecessary upward light. Glass collision hazards need separate measures. Illustrative, not measurement data.</desc>
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#101b40"/><stop offset="1" stop-color="#304a6c"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#e5f2ff" stroke-width="2"/></marker></defs>
<rect width="1200" height="680" rx="24" fill="#f5f8fb"/>
<text x="60" y="65" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#172a43">Night migration and outdoor lighting</text>
<text x="60" y="103" font-family="Arial,sans-serif" font-size="19" fill="#4a6175">Conceptual illustration • not a bird mortality estimate</text>
<rect x="50" y="132" width="530" height="410" rx="18" fill="url(#sky)"/><rect x="620" y="132" width="530" height="410" rx="18" fill="url(#sky)"/>
<text x="78" y="177" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="white">Unshielded lighting</text><text x="648" y="177" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="white">Shielded lighting</text>
<path d="M260 462 L260 300" stroke="#d7e4ef" stroke-width="13"/><circle cx="260" cy="294" r="23" fill="#ffe39a"/><path d="M260 294 L115 215 M260 294 L405 215 M260 294 L260 190" stroke="#ffd477" stroke-width="5" opacity=".7"/><path d="M260 294 L120 245 L400 245 Z" fill="#ffe18b" opacity=".16"/>
<path d="M830 462 L830 300" stroke="#d7e4ef" stroke-width="13"/><rect x="791" y="276" width="78" height="17" rx="7" fill="#e1e8f0"/><path d="M810 295 L850 295 L880 445 L780 445 Z" fill="#ffe18b" opacity=".22"/><circle cx="830" cy="302" r="11" fill="#ffe39a"/>
<path d="M100 278 Q220 212 335 269 T520 252" fill="none" stroke="#e5f2ff" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#arrow)"/><path d="M670 247 Q825 201 1090 246" fill="none" stroke="#e5f2ff" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#arrow)"/>
<g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M180 235 q12 -13 25 0 q13 -13 26 0"/><path d="M370 238 q12 -13 25 0 q13 -13 26 0"/><path d="M760 223 q12 -13 25 0 q13 -13 26 0"/><path d="M970 220 q12 -13 25 0 q13 -13 26 0"/></g>
<rect x="80" y="461" width="470" height="55" rx="12" fill="#142744" opacity=".85"/><text x="100" y="495" font-family="Arial,sans-serif" font-size="18" fill="#fff">Light spills upward and outward</text>
<rect x="650" y="461" width="470" height="55" rx="12" fill="#142744" opacity=".85"/><text x="670" y="495" font-family="Arial,sans-serif" font-size="18" fill="#fff">Light directed to the needed area</text>
<text x="60" y="592" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#172a43">Practical action</text><text x="60" y="623" font-family="Arial,sans-serif" font-size="19" fill="#334b60">Switch off unnecessary lights; use timers, shielding and appropriate brightness.</text>
<text x="60" y="652" font-family="Arial,sans-serif" font-size="17" fill="#52677b">Important: reflective and transparent glass remain separate collision risks.</text>
</svg>