<text x="882" y="400" font-family="Arial,sans-serif" font-size="20" fill="#754216">Heat delivered</text>
<path d="M675 474L745 578" stroke="#b74c4c" stroke-width="3" stroke-dasharray="9 8"/>
<circle cx="745" cy="578" r="8" fill="#b74c4c"/>
<text x="775" y="590" font-family="Arial,sans-serif" font-size="18" fill="#8a3535">Potential leak: avoid &amp; recover</text>
<rect x="60" y="614" width="1080" height="65" rx="13" fill="#e3efea"/>
<text x="84" y="640" font-family="Arial,sans-serif" font-size="18" fill="#254b43">Climate impact depends on electricity, system efficiency, refrigerant type and leakage.</text>
<text x="84" y="665" font-family="Arial,sans-serif" font-size="16" fill="#43655e">Educational illustration created for e-NetCoM · no refrigerant release is recommended or depicted as normal operation.</text>
