<path d="M596 289L611 301L596 313 M661 386L673 401L685 386 M581 424L566 436L581 448 M491 352L503 337L515 352" fill="none" stroke="#246b62" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M300 352H420" stroke="#3987a5" stroke-width="12" stroke-linecap="round"/>
<path d="M405 335L428 352L405 369" fill="none" stroke="#3987a5" stroke-width="7"/>
