name: Guide published count consistency
on:
  pull_request:
  push:
    branches: [main]
jobs:
  guide-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate counter script syntax
        run: node --check scripts/sync-guide-counts.mjs
      - name: Verify published article counts in all three languages
        run: npm run check:guide-counts
